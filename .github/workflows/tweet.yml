name: Post Tweet

on:
  schedule:
    - cron: '30 12 * * *'  # 7:30 AM EST
    - cron: '0 16 * * *'   # 11:00 AM EST
    - cron: '30 19 * * *'  # 2:30 PM EST
    - cron: '0 23 * * *'   # 6:00 PM EST
    - cron: '30 2 * * *'   # 9:30 PM EST
  workflow_dispatch:

jobs:
  tweet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Post next tweet
        env:
          TWITTER_AUTH: ${{ secrets.TWITTER_AUTH }}
          PUBLISH_POST_MAX_ATTEMPTS: "4"
          PUBLISH_RETRY_BASE_SECONDS: "1.5"
          PUBLISH_RETRY_MAX_SECONDS: "20"
        run: python src/main.py

      - name: Commit updated tracker
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -f data/posted_tracker.json ]; then
            git add data/posted_tracker.json data/posts.json
            git diff --staged --quiet || git commit -m "Update post tracker [skip ci]"
            git pull --rebase --autostash origin master
            git push
          else
             echo "Warning: data/posted_tracker.json not found, skipping commit."
          fi
