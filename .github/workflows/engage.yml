name: Twitter Engagement

concurrency:
  group: twpost-master-state
  cancel-in-progress: false

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  engage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Engagement Loop
        env:
          TWITTER_AUTH: ${{ secrets.TWITTER_AUTH }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          ENGAGEMENT_REPLY_OPTION_COUNT: "1"
          ENGAGEMENT_USE_TRENDS: "true"
        run: python src/main.py engage

      - name: Commit updated engagement tracker
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -f data/engagement_tracker.json ]; then
            git pull --rebase --autostash origin master
            git add data/engagement_tracker.json
            git diff --staged --quiet || git commit -m "Update engagement tracker [skip ci]"
            git push
          else
             echo "Warning: data/engagement_tracker.json not found, skipping commit."
          fi
